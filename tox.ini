[tox]
envlist = ruff, py
isolated_build = true
minversion = 4.0

[testenv:py]
description = Unit and fast tests (excludes integration and functional markers)
usedevelop = true
package = wheel
extras = dev
passenv = CI, GITHUB_*
setenv = COVERAGE_FILE = {toxworkdir}/.coverage.{envname}
commands =
    python -m pytest {posargs:}

[testenv:functional]
description = Long-running integration/functional tests (installs [pipeline] extra)
usedevelop = true
package = wheel
extras = dev, pipeline
passenv = CI, GITHUB_*
setenv = COVERAGE_FILE = {toxworkdir}/.coverage.{envname}
# Override default addopts that exclude these markers (see pyproject.toml).
commands = python -m pytest {posargs:} -m "integration or functional" --override-ini "addopts=-ra --strict-markers"

[testenv:docs]
description = Build the MkDocs site
usedevelop = true
extras = docs
commands =
    mkdocs build --strict

[testenv:ruff]
description = Ruff lint and format check
skip_install = true
deps = ruff>=0.4
commands =
    ruff check outerspace tests
    ruff format --check outerspace tests
