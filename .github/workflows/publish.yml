# Upload to PyPI when a GitHub Release is published or a version tag is pushed.
# Configure "pending" trusted publishing on PyPI for this repository before first use.

name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/outerspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: pip install --upgrade pip build
      - name: Build wheel and sdist
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
