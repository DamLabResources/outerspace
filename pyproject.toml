[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outerspace"
version = "0.0a1"
description = "A code to extract sequences from fastq files when the surrounding sequence is known"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "SB, DVK, REB, WD", email = "wnd22@drexel.edu"}
]
dependencies = [
    "tomlkit",
    "tqdm",
    "pyfastx",
    "regex",
    "umi_tools",
    "pyyaml",
    "numpy>=2",
    "pandas>=2",
    "pyspoa"
]

[project.optional-dependencies]
pipeline = [
    "snakemake>=9.12",
    "pulp>=2.3.1,<3.3",
]
dev = [
    "pytest>=7",
    "pytest-cov",
    "coverage[toml]",
    "tox>=4",
    "ruff>=0.4",
    "pre-commit",
    "build",
    "twine",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9",
    "pymdown-extensions",
]

[project.urls]
Homepage = "https://github.com/DamLabResources/outerspace"
Repository = "https://github.com/DamLabResources/outerspace"
Documentation = "https://outerspace.readthedocs.io/en/latest/"
"Bug Tracker" = "https://github.com/DamLabResources/outerspace/issues"

[project.scripts]
outerspace = "outerspace.cli:main"

[tool.setuptools]
packages = [
    "outerspace",
    "outerspace.cli",
    "outerspace.cli.commands",
    "outerspace.cli.utils",
    "outerspace.stats"
]

[tool.setuptools.data-files]
"outerspace/workflow" = [
    "workflow/Snakefile"
]
"outerspace/workflow/wrappers/findseq" = [
    "workflow/wrappers/findseq/wrapper.py",
    "workflow/wrappers/findseq/environment.yaml",
    "workflow/wrappers/findseq/README.md"
]
"outerspace/workflow/wrappers/collapse" = [
    "workflow/wrappers/collapse/wrapper.py",
    "workflow/wrappers/collapse/environment.yaml",
    "workflow/wrappers/collapse/README.md"
]
"outerspace/workflow/wrappers/count" = [
    "workflow/wrappers/count/wrapper.py",
    "workflow/wrappers/count/environment.yaml",
    "workflow/wrappers/count/README.md"
]
"outerspace/workflow/wrappers/merge" = [
    "workflow/wrappers/merge/wrapper.py",
    "workflow/wrappers/merge/environment.yaml",
    "workflow/wrappers/merge/README.md"
]
"outerspace/workflow/wrappers/stats" = [
    "workflow/wrappers/stats/wrapper.py",
    "workflow/wrappers/stats/environment.yaml",
    "workflow/wrappers/stats/README.md"
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# Default: fast unit tests. Use `tox -e functional` or override addopts to run integration/functional.
addopts = [
    "-ra",
    "--strict-markers",
    "-m", "not integration and not functional",
]
markers = [
    "integration: end-to-end integration tests (Snakemake; opt-in via tox -e functional)",
    "functional: long-running pipeline/CLI functional tests (opt-in via tox -e functional)",
]

[tool.coverage.run]
source = ["outerspace"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = false
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.paths]
source = ["outerspace"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["outerspace", "tests"]
exclude = [
    "build",
    "venv",
    ".tox",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
]
ignore = [
    "B008",  # function call in default argument — common in CLI
]

[tool.ruff.lint.isort]
known-first-party = ["outerspace"]
